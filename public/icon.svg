<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle-clip">
      <rect width="512" height="512" rx="128" />
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" floodColor="#000" floodOpacity="0.45" />
    </filter>
  </defs>

  <g clip-path="url(#circle-clip)">
    <!-- Upper Golden Yellow Triangle -->
    <polygon points="0,0 512,0 0,512" fill="#FFB81C" />
    
    <!-- Lower Deep Warm Orange Triangle -->
    <polygon points="512,0 512,512 0,512" fill="#FF4D00" />
    
    <!-- Subtle Inner Border -->
    <rect width="512" height="512" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.2" rx="128" />

    <!-- Center The White Druk (Thunder Dragon of Bhutan) -->
    <g transform="translate(46, 76) scale(1.4)" filter="url(#shadow)">
      <!-- Dragon Body -->
      <path
        d="M 60 160 Q 90 135 125 140 Q 155 145 180 115 Q 205 85 240 75 Q 260 70 270 58 Q 255 52 235 62 Q 200 78 175 105 Q 145 138 115 130 Q 80 120 50 152 Z"
        fill="#FFFFFF"
        stroke="#1E293B"
        stroke-width="3"
        stroke-linejoin="round"
      />
      <!-- Tail Swirls -->
      <path d="M 50 152 Q 35 160 30 175 Q 42 178 55 168 Q 62 162 65 158" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
      <path d="M 38 170 Q 25 182 22 192 Q 32 188 42 178" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />

      <!-- Dragon Head -->
      <path
        d="M 240 75 C 248 68, 258 55, 272 56 C 278 57, 285 52, 288 42 C 282 46, 275 47, 268 46 C 265 38, 258 36, 250 42 C 242 48, 235 55, 230 65 Z"
        fill="#FFFFFF"
        stroke="#1E293B"
        stroke-width="2.6"
      />
      <circle cx="265" cy="46" r="3" fill="#D90429" />
      <circle cx="266.5" cy="45" r="1" fill="#FFFFFF" />

      <!-- Antlers -->
      <path d="M 252 38 Q 250 25 242 20 Q 248 26 254 34" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 258 38 Q 262 26 268 18 Q 264 26 261 36" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />

      <!-- Claws holding Jewels (Norbu) -->
      <path d="M 215 90 L 235 110 L 245 105" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="248" cy="116" r="9" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.4" />
      <circle cx="246" cy="114" r="3" fill="#06B6D4" />

      <path d="M 180 115 L 195 140 L 208 142" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="214" cy="144" r="8.5" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.4" />
      <circle cx="212" cy="142" r="2.5" fill="#8B5CF6" />

      <path d="M 125 140 L 120 170 L 132 178" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="138" cy="180" r="8" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.4" />
      <circle cx="136" cy="178" r="2.5" fill="#3B82F6" />

      <path d="M 85 138 L 75 162 L 65 170" fill="none" stroke="#1E293B" stroke-width="3.2" stroke-linecap="round" />
      <circle cx="62" cy="174" r="7.5" fill="#F8FAFC" stroke="#1E293B" stroke-width="2" />
      <circle cx="60" cy="172" r="2" fill="#EAB308" />

      <!-- Scales Pattern -->
      <path d="M 100 132 Q 105 137 110 132 M 130 134 Q 135 140 140 134 M 160 120 Q 166 126 172 120 M 190 98 Q 196 104 202 98 M 220 80 Q 225 86 230 80" stroke="#1E293B" stroke-width="1.8" fill="none" />
    </g>
  </g>
</svg>
